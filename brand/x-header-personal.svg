<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-label="A chain of blocks with an early fork, heating up toward the right. Releasing energy since 2017.">
  <defs>
    <radialGradient id="floor" cx="0.82" cy="1.2" r="0.6">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ff6a3d" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="470" y1="232" x2="1352" y2="232">
      <stop offset="0" stop-color="#2a2522"/>
      <stop offset="0.65" stop-color="#5f5853"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="forkfade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3431"/>
      <stop offset="1" stop-color="#3a3431" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect width="1500" height="500" fill="#07060a"/>
  <rect width="1500" height="500" fill="url(#floor)"/>

  <!-- the chain -->
  <line x1="470" y1="232" x2="1352" y2="232" stroke="url(#wire)" stroke-width="2"/>
  <!-- the fork, early on, fading out -->
  <path d="M614,232 L650,268 L740,268" fill="none" stroke="url(#forkfade)" stroke-width="2"/>
  <g fill="#07060a" stroke-width="2">
    <rect x="652" y="261" width="14" height="14" stroke="#3a3431"/>
    <rect x="690" y="261" width="14" height="14" stroke="#2e2926"/>
  </g>

  <!-- blocks, cooling to warm, left to right -->
  <g fill="#07060a" stroke-width="2">
    <rect x="482" y="225" width="14" height="14" stroke="#2f2a27"/>
    <rect x="526" y="225" width="14" height="14" stroke="#34302c"/>
    <rect x="570" y="225" width="14" height="14" stroke="#3a3431"/>
    <rect x="614" y="225" width="14" height="14" stroke="#403935"/>
    <rect x="658" y="225" width="14" height="14" stroke="#463f3a"/>
    <rect x="702" y="225" width="14" height="14" stroke="#4c4540"/>
    <rect x="746" y="225" width="14" height="14" stroke="#524a45"/>
    <rect x="790" y="225" width="14" height="14" stroke="#58504a"/>
    <rect x="834" y="225" width="14" height="14" stroke="#5f5853"/>
    <rect x="878" y="225" width="14" height="14" stroke="#68594f"/>
    <rect x="922" y="225" width="14" height="14" stroke="#735b4b"/>
    <rect x="966" y="225" width="14" height="14" stroke="#7f5d47"/>
    <rect x="1010" y="225" width="14" height="14" stroke="#8c5f44"/>
    <rect x="1054" y="225" width="14" height="14" stroke="#9b6142"/>
    <rect x="1098" y="225" width="14" height="14" stroke="#ad6240"/>
    <rect x="1142" y="225" width="14" height="14" stroke="#c2643e"/>
    <rect x="1186" y="225" width="14" height="14" stroke="#d6663d"/>
    <rect x="1230" y="225" width="14" height="14" stroke="#e8683d"/>
    <rect x="1274" y="225" width="14" height="14" stroke="#f5693d"/>
  </g>
  <!-- the newest block, lit -->
  <rect x="1314" y="221" width="22" height="22" fill="#ff6a3d" opacity="0.7" filter="url(#glow)"/>
  <rect x="1314" y="221" width="22" height="22" fill="#ff8a4a" stroke="#ffd166" stroke-width="2"/>

  <!-- embers off the newest block -->
  <g fill="#ffb347">
    <circle cx="1333" cy="196" r="3.2" opacity="0.9" filter="url(#soft)"/><circle cx="1333" cy="196" r="2.2"/>
    <circle cx="1311" cy="176" r="2" opacity="0.6"/>
    <circle cx="1344" cy="158" r="1.6" opacity="0.45"/>
    <circle cx="1322" cy="134" r="1.3" opacity="0.3"/>
  </g>

  <text x="1352" y="302" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9b928c">releasing energy since 2017</text>
  <text x="482" y="206" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13" letter-spacing="2" fill="#4a4440">2017</text>
</svg>
