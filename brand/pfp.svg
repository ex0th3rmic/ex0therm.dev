<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="ex0therm profile picture: a glowing zero">
  <defs>
    <!-- heat rises: white-hot at the bottom of the ring, ember at the top -->
    <linearGradient id="ring" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="0.28" stop-color="#ffb347"/>
      <stop offset="0.7" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#d9381e"/>
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="1.08" r="0.62">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff6a3d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inner" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff9a4d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#07060a"/>
  <rect width="1024" height="1024" fill="url(#floor)"/>

  <!-- the zero: a tall ellipse, like the glyph -->
  <ellipse cx="512" cy="520" rx="196" ry="262" fill="url(#inner)"/>
  <ellipse cx="512" cy="520" rx="196" ry="262" fill="none" stroke="url(#ring)" stroke-width="92" opacity="0.75" filter="url(#glow)"/>
  <ellipse cx="512" cy="520" rx="196" ry="262" fill="none" stroke="url(#ring)" stroke-width="84"/>

  <!-- embers rising off the top -->
  <g fill="#ffb347">
    <circle cx="604" cy="214" r="9" opacity="0.9" filter="url(#soft)"/>
    <circle cx="604" cy="214" r="6"/>
    <circle cx="452" cy="178" r="6" opacity="0.75"/>
    <circle cx="548" cy="132" r="4.5" opacity="0.55"/>
    <circle cx="660" cy="150" r="3.5" opacity="0.4"/>
    <circle cx="398" cy="226" r="4" opacity="0.5"/>
  </g>
</svg>
